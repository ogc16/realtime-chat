name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build jar
        run: ./mvnw -B -DskipTests package

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Write checksums
        run: |
          cd target
          sha256sum chat-*.jar > SHA256SUMS
          cat SHA256SUMS

      - name: Sign the jar (keyless)
        run: |
          JAR=$(ls target/chat-*.jar | head -n1)
          cosign sign-blob --yes \
            --output-signature "${JAR}.sig" \
            --output-certificate "${JAR}.pem" \
            "${JAR}"

      - name: Generate build provenance (SLSA)
        id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: target/chat-*.jar

      - name: Stage provenance bundle for the release
        run: |
          JAR=$(basename "$(ls target/chat-*.jar | head -n1)")
          cp "${{ steps.provenance.outputs.bundle-path }}" "target/${JAR}.intoto.jsonl"
          ls -l target/*.intoto.jsonl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            target/chat-*.jar
            target/chat-*.jar.sig
            target/chat-*.jar.pem
            target/chat-*.jar.intoto.jsonl
            target/SHA256SUMS

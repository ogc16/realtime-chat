<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <script src="/vendor/sockjs.min.js"></script>
    <script src="/vendor/stomp.umd.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --panel-2: #273449;
            --border: #334155;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #6366f1;
            --accent-2: #818cf8;
            --own: #4338ca;
            --green: #22c55e;
            --red: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app {
            width: 100%;
            max-width: 980px;
            height: 92vh;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
        }
        .sidebar {
            width: 230px;
            border-right: 1px solid var(--border);
            background: var(--panel-2);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .sidebar h1 {
            font-size: 18px;
            letter-spacing: .3px;
            margin-bottom: 4px;
        }
        .sidebar p.sub { color: var(--muted); font-size: 12px; margin-bottom: 24px; }
        .sidebar .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 10px; }
        .user-list { list-style: none; flex: 1; overflow-y: auto; }
        .user-list li {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        .user-list li .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--muted);
            border-top: 1px solid var(--border);
            padding-top: 14px;
            margin-top: 14px;
        }
        .status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); }
        .status.connected .dot { background: var(--green); }
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .header {
            padding: 14px 22px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header strong { color: var(--text); }
        #messages { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 72%; display: flex; flex-direction: column; }
        .msg .meta { font-size: 11px; color: var(--muted); margin-bottom: 3px; padding: 0 4px; }
        .msg .meta .time { margin-left: 6px; opacity: .75; }
        .msg .bubble {
            padding: 9px 13px;
            border-radius: 14px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            font-size: 14px;
            line-height: 1.45;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .msg.own { align-self: flex-end; align-items: flex-end; }
        .msg.own .bubble {
            background: var(--own);
            border-color: var(--own);
        }
        .system { align-self: center; font-size: 12px; color: var(--muted); background: rgba(148, 163, 184, .08); padding: 5px 14px; border-radius: 999px; }
        .form {
            display: flex;
            gap: 10px;
            padding: 16px 22px;
            border-top: 1px solid var(--border);
        }
        #messageInput {
            flex: 1;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            padding: 12px 14px;
            font-size: 14px;
            outline: none;
        }
        #messageInput:focus { border-color: var(--accent); }
        #messageInput:disabled { opacity: .5; }
        .form button {
            background: var(--accent);
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 12px 22px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
        }
        .form button:hover { background: var(--accent-2); }
        .form button:disabled { opacity: .5; cursor: not-allowed; }

        .input-wrap { position: relative; flex: 1; display: flex; }
        .input-wrap #messageInput { flex: 1; }
        .suggestions {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(100% + 8px);
            list-style: none;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, .4);
            z-index: 6;
            max-height: 220px;
            overflow-y: auto;
        }
        .suggestions li {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 9px 14px;
            font-size: 14px;
            cursor: pointer;
        }
        .suggestions li .hint { color: var(--muted); font-size: 11px; }
        .suggestions li.active,
        .suggestions li:hover { background: var(--accent); color: #fff; }
        .suggestions li.active .hint,
        .suggestions li:hover .hint { color: rgba(255, 255, 255, .8); }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, .7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .modal {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px;
            width: 340px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
        }
        .modal h2 { font-size: 20px; margin-bottom: 6px; }
        .modal p { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
        .modal input {
            width: 100%;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            padding: 11px 13px;
            font-size: 14px;
            outline: none;
            margin-bottom: 14px;
        }
        .modal input:focus { border-color: var(--accent); }
        .modal button {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 11px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .modal button:hover { background: var(--accent-2); }
        .error { color: var(--red); font-size: 13px; display: none; margin-top: 8px; }
    </style>
</head>
<body>

<div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
        <h2>Join the chat</h2>
        <p>Pick a display name to get started.</p>
        <input id="nameInput" placeholder="Your name" maxlength="30" autofocus>
        <button id="joinBtn">Connect</button>
        <div class="error" id="nameError">Please enter a name.</div>
    </div>
</div>

<div class="app" id="app">
    <aside class="sidebar">
        <h1>Realtime Chat</h1>
        <p class="sub">Spring WebSocket · STOMP</p>
        <div class="label">Online</div>
        <ul class="user-list" id="userList"></ul>
        <div class="status" id="connStatus">
            <span class="dot"></span>
            <span id="connText">Connecting…</span>
        </div>
    </aside>
    <div class="main">
        <div class="header" id="roomHeader">Joined room <strong id="roomName">public</strong></div>
        <div id="messages"></div>
        <form class="form" id="messageForm">
            <div class="input-wrap">
                <input id="messageInput" type="text" placeholder="Type a message… (/ask for the bot)" maxlength="1000" autocomplete="off" disabled>
                <ul class="suggestions" id="suggestions" hidden></ul>
            </div>
            <button id="sendBtn" type="submit" disabled>Send</button>
        </form>
    </div>
</div>

<script>
    const messagesEl = document.getElementById('messages');
    const userListEl = document.getElementById('userList');
    const form = document.getElementById('messageForm');
    const input = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const connStatus = document.getElementById('connStatus');
    const connText = document.getElementById('connText');
    const suggestionsEl = document.getElementById('suggestions');

    const users = new Set();
    let username = null;
    let stompClient = null;

    const timeFmt = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    function renderUsers() {
        userListEl.innerHTML = '';
        [...users].sort().forEach((u) => {
            const li = document.createElement('li');
            li.innerHTML = '<span class="dot"></span>' + escapeHtml(u);
            userListEl.appendChild(li);
        });
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    // ---- Autocomplete / typeahead ----
    let suggestions = [];
    let activeIndex = -1;
    let debounceTimer = null;

    function lastWord(value) {
        const m = value.match(/([A-Za-z][A-Za-z0-9']*)$/);
        return m ? m[1] : '';
    }

    function hideSuggestions() {
        suggestions = [];
        activeIndex = -1;
        suggestionsEl.hidden = true;
        suggestionsEl.innerHTML = '';
    }

    function showSuggestions(list) {
        suggestions = list;
        activeIndex = -1;
        if (!list.length) { hideSuggestions(); return; }
        suggestionsEl.innerHTML = '';
        list.forEach((word, i) => {
            const li = document.createElement('li');
            li.dataset.index = i;
            li.innerHTML = '<span>' + escapeHtml(word) + '</span><span class="hint">Tab</span>';
            li.addEventListener('mousedown', (e) => { e.preventDefault(); applySuggestion(word); });
            suggestionsEl.appendChild(li);
        });
        suggestionsEl.hidden = false;
    }

    function setActive(index) {
        if (!suggestions.length) return;
        activeIndex = (index + suggestions.length) % suggestions.length;
        [...suggestionsEl.children].forEach((li, i) => li.classList.toggle('active', i === activeIndex));
    }

    function applySuggestion(word) {
        const value = input.value;
        const m = value.match(/([A-Za-z][A-Za-z0-9']*)$/);
        input.value = (m ? value.slice(0, value.length - m[1].length) : value) + word + ' ';
        hideSuggestions();
        input.focus();
    }

    async function requestSuggestions() {
        const prefix = lastWord(input.value);
        if (prefix.length < 1) { hideSuggestions(); return; }
        try {
            const res = await fetch('/api/autocomplete?limit=6&q=' + encodeURIComponent(prefix));
            if (!res.ok) { hideSuggestions(); return; }
            showSuggestions(await res.json());
        } catch {
            hideSuggestions();
        }
    }

    input.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(requestSuggestions, 120);
    });

    input.addEventListener('keydown', (e) => {
        if (!suggestions.length) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); setActive(activeIndex + 1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(activeIndex - 1); }
        else if (e.key === 'Tab' && activeIndex >= 0) { e.preventDefault(); applySuggestion(suggestions[activeIndex]); }
        else if (e.key === 'Escape') { hideSuggestions(); }
    });

    input.addEventListener('blur', () => setTimeout(hideSuggestions, 100));

    function addMessage(msg) {
        const type = msg.type || 'CHAT';
        const text = msg.content || '';

        if (type === 'CHAT') {
            const wrap = document.createElement('div');
            const own = msg.sender === username;
            wrap.className = 'msg' + (own ? ' own' : '');
            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.innerHTML = '<span>' + escapeHtml(msg.sender || 'anonymous') + '</span>' +
                             '<span class="time">' + timeFmt(msg.timestamp || Date.now()) + '</span>';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            wrap.appendChild(meta);
            wrap.appendChild(bubble);
            messagesEl.appendChild(wrap);
        } else if (type === 'JOIN') {
            const s = document.createElement('div');
            s.className = 'system';
            s.textContent = msg.sender + ' joined the chat';
            messagesEl.appendChild(s);
            users.add(msg.sender);
            renderUsers();
        } else if (type === 'LEAVE') {
            const s = document.createElement('div');
            s.className = 'system';
            s.textContent = msg.sender + ' left the chat';
            messagesEl.appendChild(s);
            users.delete(msg.sender);
            renderUsers();
        }
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function connect(name) {
        username = name;
        setConnected(false, 'Connecting…');

        stompClient = new StompJs.Client({
            webSocketFactory: () => new SockJS('/ws'),
            reconnectDelay: 2000,
            onConnect: () => {
                setConnected(true, 'Connected');
                stompClient.subscribe('/topic/public', (frame) => {
                    addMessage(JSON.parse(frame.body));
                });
                stompClient.publish({
                    destination: '/app/chat.addUser',
                    body: JSON.stringify({ type: 'JOIN', sender: username, content: '', timestamp: Date.now() })
                });
                enableChat();
            },
            onWebSocketError: () => {
                setConnected(false, 'Connection error');
            },
            onStompError: (frame) => {
                setConnected(false, 'STOMP error');
            },
            onWebSocketClose: () => {
                setConnected(false, 'Disconnected');
            }
        });

        stompClient.activate();
    }

    function enableChat() {
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
    }

    function setConnected(connected, text) {
        connStatus.classList.toggle('connected', connected);
        connText.textContent = text;
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text || !stompClient || !stompClient.connected) return;
        stompClient.publish({
            destination: '/app/chat.sendMessage',
            body: JSON.stringify({ type: 'CHAT', sender: username, content: text, timestamp: Date.now() })
        });
        input.value = '';
        hideSuggestions();
        input.focus();
    });

    document.getElementById('joinBtn').addEventListener('click', () => {
        const name = document.getElementById('nameInput').value.trim();
        document.getElementById('nameError').style.display = 'none';
        if (!name) {
            document.getElementById('nameError').style.display = 'block';
            return;
        }
        document.getElementById('modalBackdrop').style.display = 'none';
        connect(name);
    });

    document.getElementById('nameInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('joinBtn').click();
    });
</script>
</body>
</html>
